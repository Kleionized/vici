  /* ── onboarding v2 · night tide theme — scoped variable override ── */
  .o2-night {

  @keyframes o2-swell { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes o2-tick { 0% { opacity: 0; transform: translateY(7px) scale(.9); } 100% { opacity: 1; transform: none; } }
  @keyframes o2-gauge { from { stroke-dashoffset: var(--o2-gfrom, 260); } }

  :root {
    /* paper canvas — VICI's monochrome serif system, unified with the Today home screen */
    --bg: #F4F3F0;
    --bg2: #F0EFEB;
    --bg-deep: #EBE9E5;
    --card: #FFFFFF;
    --card-2: #FFFFFF;
    --card-solid: #FFFFFF;
    --ink: #1D1C1A;
    --ink2: #55534E;
    --ink3: #8B8882;
    --ink4: #B4B1AB;
    --line: rgba(0,0,0,0.09);
    --hair: rgba(0,0,0,0.08);
    --soft: rgba(0,0,0,0.045);
    --soft2: rgba(0,0,0,0.1);

    /* neutral ink fill — matches the home screen's #131313 dark exactly */
    --warm: #131313;
    --warm2: #0D0D0D;
    --fill: #131313;
    --on-fill: #F5F4F1;
    --on-fill-2: rgba(245,244,241,0.7);

    /* kept as a single muted neutral — no hue accents app-wide */
    --accent: #131313;
    --accent-2: #0D0D0D;

    --halo: 1;            /* ambient-motion intensity multiplier */
    --elev: #EFEEEA;
    --danger: #B5624F;
    --kbd-bg: #E8E7E3;
    --kbd-key: #FFFFFF;
    --kbd-ink: #1D1C1A;
    --radius: 18px;

    /* ── elevation — removed: fully flat, solid cards ── */
    --shadow-card: 0 0 rgba(0,0,0,0);
    --shadow-pop: 0 0 rgba(0,0,0,0);
    --shadow-fill: 0 0 rgba(0,0,0,0);
    --shadow-knob: 0 0 rgba(0,0,0,0);
    /* flat ink fill — both endpoints resolve to the solid fill */
    --fill-hi: var(--fill);
    --fill-lo: var(--fill);
    /* solid paper for floating chrome (was frosted glass) */
    --glass: #F8F7F4;
    --glass-edge: transparent;
    --grain: 1;
    --font: 'Gill Sans', 'Gill Sans MT', 'Gill Sans Nova', 'Trebuchet MS', Calibri, sans-serif;
    --font-display: 'EB Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    /* headline identity font — EB Garamond, matching the home screen's "Day XXIV" */
    --serif: 'EB Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    --serif-tint: #55534E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #F4F3F0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
  body { font-optical-sizing: auto; }
  button { font-family: inherit; -webkit-font-smoothing: antialiased; }
  /* raw <b>/<strong> render at 700 by default — keep emphasis a step quieter */
  b, strong { font-weight: 600; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* ── micro-interactions: springy press on tappables ── */
  .tl-press { transition: transform .16s cubic-bezier(.34,1.45,.6,1), box-shadow .22s ease, background .2s ease, opacity .2s ease, border-color .2s ease; }
  .tl-press:active { transform: scale(0.965); }
  .tl-press-soft { transition: transform .18s cubic-bezier(.34,1.45,.6,1), box-shadow .22s ease, background .2s ease, opacity .2s ease, border-color .2s ease; }
  .tl-press-soft:active { transform: scale(0.985); }
  /* stats & counters read best with lining tabular figures */
  .tnum { font-variant-numeric: lining-nums tabular-nums; }
  /* blinking text caret for live-keyboard mockups */
  @keyframes tl-caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .tl-caret { animation: tl-caret 1.15s steps(1) infinite; }
  }
  /* solid paper chrome — the floating-bar material (blur removed) */
  .tl-glass { background: var(--glass); }
  /* faint paper grain laid over each screen — physicality at 3% */
  .tl-grain { position: absolute; inset: 0; z-index: 80; pointer-events: none; opacity: calc(var(--grain) * 0.6);
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='matrix' values='0 0 0 0 0.32 0 0 0 0 0.31 0 0 0 0 0.26 0 0 0 0.055 0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .gicofit svg { width: 100% !important; height: 100% !important; }
  /* world-list card art: fluid width, cropped by the card */
  .wla svg { width: 100%; height: auto; display: block; }
  @keyframes ci-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @media (prefers-reduced-motion: no-preference) {
    .ci-breathe { animation: ci-breathe 6s ease-in-out infinite; transform-origin: center; }
  }
  @keyframes onb-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes onb-draw { to { stroke-dashoffset: 0; } }
  @keyframes onb-drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6%, 4%) scale(1.08); } }
  @keyframes onb-drift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-5%, -3%) scale(1); } }
  @keyframes onb-twinkle { 0%,100% { opacity: .18; } 50% { opacity: .55; } }
  @keyframes onb-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes onb-bob2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  @keyframes onb-sun { 0%,100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.05); opacity: 1; } }
  @keyframes onb-pulse { 0% { transform: scale(.6); opacity: .5; } 70%,100% { transform: scale(2.4); opacity: 0; } }
  @keyframes onb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: no-preference) {
    .onb-rise { animation: onb-rise .6s ease both; }
    .onb-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: onb-draw 1.3s .2s ease forwards; }
    .onb-drift { animation: onb-drift 22s ease-in-out infinite; }
    .onb-drift2 { animation: onb-drift2 26s ease-in-out infinite; }
    .onb-twinkle { animation: onb-twinkle 4s ease-in-out infinite; }
    .onb-bob { animation: onb-bob 6s ease-in-out infinite; transform-origin: center; }
    .onb-bob2 { animation: onb-bob2 7.5s ease-in-out infinite; transform-origin: center; }
    .onb-sun { animation: onb-sun 7s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .onb-pulse { animation: onb-pulse 3s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .onb-spin { animation: onb-spin 14s linear infinite; transform-origin: center; transform-box: fill-box; }
  }
  @keyframes onb-pop { 0% { transform: scale(1); } 38% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes onb-float { 0% { transform: translateY(26px) scale(.7); opacity: 0; } 16% { opacity: .55; } 82% { opacity: .4; } 100% { transform: translateY(-138px) scale(1); opacity: 0; } }
  @keyframes onb-confetti { 0% { transform: translateY(-30px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(580px) rotate(620deg); opacity: 0; } }
  @keyframes onb-stamp { 0% { transform: scale(1.7); opacity: 0; } 58% { transform: scale(.93); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes onb-bloom { 0% { transform: scale(.35); opacity: .55; } 100% { transform: scale(2.7); opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .onb-pop { animation: onb-pop .32s ease; }
    .onb-float { animation-name: onb-float; animation-timing-function: linear; animation-iteration-count: infinite; }
    .onb-confetti { animation-name: onb-confetti; animation-timing-function: linear; animation-iteration-count: infinite; }
    .onb-stamp { animation: onb-stamp .5s cubic-bezier(.2,1.3,.4,1) both; }
    .onb-bloom { animation: onb-bloom 1.5s ease-out forwards; transform-origin: center; transform-box: fill-box; }
  }
  /* image-slot placeholders, themed for the paper canvas */
  image-slot { --slot-bg: rgba(0,0,0,0.035); --slot-fg: #9C9C92; --slot-border: rgba(0,0,0,0.12); border-radius: 22px; }
  @keyframes cc-twinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
  @keyframes cc-orbit { to { transform: rotate(360deg); } }
  @keyframes cc-glow { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .85; transform: scale(1.04); } }
  @keyframes cc-pulse { 0% { transform: scale(0.92); opacity: 0; } 28% { opacity: 0.16; } 100% { transform: scale(1.5); opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .cc-twinkle { animation: cc-twinkle 4.5s ease-in-out infinite; }
    .cc-orbit { animation: cc-orbit 42s linear infinite; transform-origin: center; transform-box: fill-box; }
    .cc-glow { animation: cc-glow 7s ease-in-out infinite; transform-origin: center; }

  }
  @keyframes urge-breath { 0%, 100% { transform: translateX(-50%) scale(0.82); opacity: 0.7; } 50% { transform: translateX(-50%) scale(1.12); opacity: 1; } }
  @keyframes urge-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes urge-leave { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(152px); opacity: 0; } }
  @keyframes urge-ring { 0% { transform: scale(0.32); opacity: 0; } 16% { opacity: 0.55; } 100% { transform: scale(1.95); opacity: 0; } }
  @keyframes urge-bob { 0%, 100% { transform: scaleY(0.6); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: no-preference) {
    .urge-breath { animation: urge-breath 5.5s ease-in-out infinite; }
    .urge-fade { animation: urge-fade .6s ease both; }
    .urge-leave { animation: urge-leave 3.6s ease-in-out infinite; }
    .urge-ring { animation: urge-ring 3s ease-out infinite; }
    .urge-bob { animation: urge-bob 1.1s ease-in-out infinite; transform-origin: center bottom; }
  }
  /* ── the day-3 letter: delivery, seal, flap, unfold ── */
  @keyframes ltr-dim { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ltr-drop { 0% { opacity: 0; transform: translateY(-46px) rotate(-4deg) scale(.93); } 62% { opacity: 1; } 100% { opacity: 1; transform: translateY(-54%) rotate(0deg) scale(1); } }
  @keyframes ltr-hover { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(-1.1deg) translateY(-5px); } }
  @keyframes ltr-seal-crack { 0% { transform: scale(1) rotate(0deg); opacity: 1; } 42% { transform: scale(1.18) rotate(-9deg); opacity: 1; } 100% { transform: scale(1.5) rotate(-19deg); opacity: 0; } }
  @keyframes ltr-flap { to { transform: rotateX(-178deg); } }
  @keyframes ltr-out { to { transform: translateY(-108px); } }
  @keyframes ltr-away { 0% { opacity: 1; transform: translateY(-54%) scale(1); } 100% { opacity: 0; transform: translateY(calc(-54% + 74px)) scale(.93); } }
  @keyframes ltr-sheet { 0% { opacity: 0; transform: translateY(30px) scale(.952); } 100% { opacity: 1; transform: none; } }
  @keyframes ltr-sheen { 0% { transform: translateX(-130%) rotate(9deg); opacity: 0; } 18% { opacity: .55; } 100% { transform: translateX(250%) rotate(9deg); opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .ltr-dim { animation: ltr-dim .55s ease both; }
    .ltr-drop { animation: ltr-drop .8s cubic-bezier(.24,1.24,.42,1) both; }

    .ltr-hover { animation: ltr-hover 5.5s ease-in-out infinite; }
    .ltr-seal-crack { animation: ltr-seal-crack .55s ease-in both; }

    .ltr-sheen { animation: ltr-sheen 2.3s ease .5s both; }
  }
  /* ── onboarding v3 + motion vocabulary — the monochrome reward axis ──

  .o3-daybreak, .o3-daybreak * { transition: background-color 4.5s ease, color 4.5s ease, border-color 4.5s ease, stroke 4.5s ease, fill 4.5s ease, box-shadow 4.5s ease; }

// each screen wrapped in the device bezel, sized to the artboard
// light state for the device chrome; App refreshes this each render
let CURRENT_DARK = false;

function Frame({ Screen, dark }) {
  return (
    <IOSDevice width={W} height={H} dark={dark === undefined ? CURRENT_DARK : dark}>
      <div style={{ position: 'absolute', inset: 0 }}>
        <Screen />
        <div className="tl-grain"></div>
      </div>
    </IOSDevice>
  );
}
// NOTE: boards that used to force dark=true (urge surfing, relapse) now
// render light by default too — the whole app lives in one paper system.
// Pass dark explicitly only for a screen that's intentionally still dark.

// plain factory — returns a DCArtboard ELEMENT so DCSection recognises it by type
function board(id, label, Screen, dark) {
  return (
    <DCArtboard id={id} label={label} width={W} height={H}>
      <Frame Screen={Screen} dark={dark} />
    </DCArtboard>
  );
}

          {board("lesson-pg-calm", "Lesson · the close", LessonPgCalm, true)}
          {board("lesson-pg-done", "Lesson · ridden", LessonPgDone)}
          {board("lesson", "Lesson reader · scroll alternative (the leaf)", LessonReaderScreen)}
        </DCSection>

        <DCSection id="lesson-pages" title="Lessons · interactive pages" subtitle="Five interactive page kinds join the reader's display pages, shown on “The early warnings”: a teach page whose button is the takeaway itself; chain-the-lesson-to-a-routine pick; a self-check that holds one warning sign up per page (Not me / That's me); a what's-underneath feelings grid; and the collect page that gathers your signs into one memorized line.">
          {board("lpg-live", "Live · teach → pick → self-check ×2 → grid → collect", LessonPagesFlow)}
          {board("lpg-teach", "Teach · the takeaway is the button", LPGBoard_Teach)}
          {board("lpg-pick", "Pick · chain it to an existing routine", LPGBoard_Pick)}
          {board("lpg-check", "Self-check · one sign per page", LPGBoard_Check)}
          {board("lpg-grid", "Grid · what's underneath, multi-select", LPGBoard_Grid)}
          {board("lpg-collect", "Collect · your signs, memorized", LPGBoard_Collect)}
        </DCSection>

        <DCSection id="keepsakes" title="Medallions · achievements" subtitle="The campaign album, renamed from Keepsakes per the medallions catalog: twelve medallions — three pillars carry the wordmark (Veni, earned once for crossing in; Vidi, tiered on days witnessed; Vici, tiered on urges outlasted) with nine more around them, newest among them Back on deck, earned for coming back to the app after an urge instead of vanishing. Ladders now run long (Vici to ×1000, Vidi to a year), every tier has its own line, and the postmark ring / tier pips / earned · within reach · still ahead layout stays exactly as designed.">
          {board("keepsakes-live", "Live · album → tap a medallion → story", KeepsakesFlow)}
          {board("keepsakes", "The album · earned / within reach / ahead", KeepsakesScreen)}
          {board("keepsake-detail", "Detail · tier ladder (never failed twice)", KeepsakeDetailScreen)}
          {board("keepsake-progress", "Detail · within reach (ground taken)", KeepsakeProgressScreen)}
          {board("keepsake-ahead", "Detail · not earned yet (let someone in)", KeepsakeAheadScreen)}
        </DCSection>

        <DCSection id="depth" title="Depth" subtitle="Library search">
          {board("search", "Library search", LibrarySearchScreen)}
          {board("search-empty", "Search · no results (designed)", SearchEmptyScreen)}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Atmosphere" />
        <TweakColor label="Ink tone" value={t.accent}
          options={["#131313", "#3E3226", "#33363A", "#2B2F28"]}
          onChange={(v) => setTweak('accent', v)} />
        <TweakSlider label="Ambient motion" value={t.glow} min={0.4} max={1.6} step={0.1}
          onChange={(v) => setTweak('glow', v)} />
        <TweakToggle label="Paper grain" value={t.grain}
          onChange={(v) => setTweak('grain', v)} />
        <TweakSection label="Scenes" />
        <TweakRadio label="Scene tone" value={t.sceneTone || 'paper'}
          options={["paper", "ink"]}
          onChange={(v) => setTweak('sceneTone', v)} />
        <TweakSection label="Type" />
        <TweakSelect label="Typeface" value={t.font}
          options={["Garamond", "Newsreader", "Spectral"]}
          onChange={(v) => setTweak('font', v)} />
        <TweakSection label="Motif" />
        <TweakRadio label="Signature" value={t.motif}
          options={["moon", "tide"]}
          onChange={(v) => setTweak('motif', v)} />
        <TweakSection label="Check-in" />
        <TweakSelect label="Central visual" value={t.checkinVisual}
          options={["weather", "tone", "weather-paper", "orb", "moon", "bloom", "rings", "aurora", "tide"]}
          onChange={(v) => setTweak('checkinVisual', v)} />
        <TweakRadio label="Mood colour" value={t.moodColor}
          options={["calm", "vivid"]}
          onChange={(v) => setTweak('moodColor', v)} />
        <TweakSection label="Onboarding" />
        <TweakRadio label="Theme" value={t.onbTheme || 'night'}
          options={["night", "paper"]}
          onChange={(v) => setTweak('onbTheme', v)} />
        <TweakSection label="Onboarding v3" />
        <TweakRadio label="Campaign map" value={t.onb3Map || 'route'}
          options={["route", "chart", "contents"]}
          onChange={(v) => setTweak('onb3Map', v)} />
        <TweakToggle label="Night → dawn sky" value={t.onb3Sky !== false}
          onChange={(v) => setTweak('onb3Sky', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
